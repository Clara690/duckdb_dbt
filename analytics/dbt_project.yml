name: analytics # what the project is called 

# connection in ~/.dbt/profiles.yml -> the warehouse
# the name is the same with the first line .dbt/profiles.yml -> profile name must match project name
profile: analytics 

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets: # what dbt clean deletes; adds dbt_packages 
  - "target"
  - "dbt_packages"

